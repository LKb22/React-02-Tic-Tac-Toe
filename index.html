<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/game-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Tic-Tac-Toe</title>
  </head>
  <body>
    <header>
      <!-- Don'T forget that, even though we are building a React App, of course we can put normal html code that does not have to belong to a component, etc. directly in our index.html. Also, all the files in the public folder will be served alongside the index.html file, meaning that these files will always be available to our website visitors, whether in a component or in the html. And, we can simply use the names of these files in our src without having to use the path. -->
      <img src="game-logo.png" alt="Hand-drawn tic-tac-toe game board" />
      <h1>Tic-Tac-Toe</h1>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
